name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  manifests:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/build_index.py --check
      - run: python3 scripts/build_index.py --out dist
      - run: python3 scripts/check_releases.py
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/phantom-mdx/package-lock.json
      - run: npm ci
        working-directory: packages/phantom-mdx
      - run: npm test
        working-directory: packages/phantom-mdx
      - run: npm run build
        working-directory: packages/phantom-mdx
      - run: node packages/phantom-mdx/dist/cli.js check extensions/*
